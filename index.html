(function(){var base=null;function h(s){var x=0;for(var i=0;i<s.length;i++){x=(x*31+s.charCodeAt(i))|0}return x}
function get(){return fetch(location.pathname+'?_u='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():null}).then(function(t){return t?h(t):null}).catch(function(){return null})}
function bar(){if(document.getElementById('updBar'))return;var d=document.createElement('div');d.id='updBar';d.dir='rtl';
d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:99999;background:#7A1F33;color:#fff;padding:10px 18px;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.28);font-weight:600;font-size:14px;display:flex;gap:12px;align-items:center;max-width:92vw;font-family:inherit';
d.innerHTML='<span>🔄 يوجد تحديث جديد للمنصة</span><button type="button" style="background:#fff;color:#7A1F33;border:0;border-radius:10px;padding:6px 16px;font:inherit;cursor:pointer">تحديث الآن</button><button type="button" aria-label="إغلاق" style="background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:0 2px">×</button>';
var b=d.querySelectorAll('button');b[0].onclick=function(){location.reload()};b[1].onclick=function(){d.remove()};document.body.appendChild(d)}
function chk(){get().then(function(x){if(x==null)return;if(base==null){base=x;return}if(x!==base)bar()})}
chk();setInterval(chk,180000);document.addEventListener('visibilitychange',function(){if(!document.hidden)chk()})})();</script>
